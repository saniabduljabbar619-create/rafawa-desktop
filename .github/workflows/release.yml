name: Release build

# Builds the Windows executable (and installer) when a version tag is pushed, or on demand.
#   git tag v3.5.0 && git push origin v3.5.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"        # last Python with PySide2 wheels

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller RafawaApp.spec --clean --noconfirm

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = python -c "from shared.version import __version__; print(__version__)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RafawaApp-windows
          path: |
            dist/RafawaApp.exe
            RafawaAppSetup.exe
