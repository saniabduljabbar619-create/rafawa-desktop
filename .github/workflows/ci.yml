name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PySide2 (the GUI toolkit this app is built on) supports up to 3.10
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # The business logic under test never imports Qt, and the tests run on
      # SQLite, so the GUI/MySQL/Windows-only dependencies are not needed here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "SQLAlchemy>=2.0,<3" "PyMySQL>=1.1,<2" "httpx>=0.27,<1" "openpyxl>=3.1,<4" -r requirements-dev.txt

      - name: Lint (correctness rules)
        run: ruff check .

      - name: Byte-compile everything
        run: python -m compileall -q apps database shared tests

      - name: Unit tests
        run: python -m pytest -q
