name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04      # ubuntu-latest moved to 26.04, which has no Python 3.9
    strategy:
      fail-fast: false
      matrix:
        # PySide2 (the GUI toolkit this app is built on) supports up to 3.10
        python-version: ["3.9", "3.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Qt needs a few system libraries even in headless ("offscreen") mode.
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      # The tests run on SQLite; MySQL-only/Windows-only packages are not needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "PySide2>=5.15,<6" "SQLAlchemy>=2.0,<3" "PyMySQL>=1.1,<2" "httpx>=0.27,<1" "openpyxl>=3.1,<4" "alembic>=1.13,<2" -r requirements-dev.txt

      - name: Lint (correctness rules)
        run: ruff check .

      - name: Byte-compile everything
        run: python -m compileall -q apps database shared tests

      - name: Tests (services + headless GUI smoke tests)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
